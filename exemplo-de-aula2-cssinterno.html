<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de classes e CSS interno</title>
    <style>
        .titulo{
            color:rgb(255, 127, 244)
            text-align:center;
        }

        .caixa01{
            background-color: rgb(153, 14, 14);
            border: 2px solid ;
            padding: 20px ;
            margin: 20px;
        }

        .caixa02{
            background-color: blueviolet (32, 83,83);
            border: 2px solid (247, 220, 220);
            padding: 20px;
            margin: 20px;
        }

        .destaque01{
            color: rgb(218, 23, 23);
            font-weight: bold;
        }

        .destaque02{
            color: blueviolet;
            background-color: rgb(247, 18, 18);
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar os elementos de uma página.
        </p>
        <br>
        <p class="destaque01">
            Este paragrafo utiliza a classe destaque01
        </p>
        <br>
        <p class="destaque02">
            Este paragrafo utiliza a classe destaque02
        </p>
    </div>
    <div class="caixa02">
        <p>Este paragrafo não utiliza nenhuma classe</p>
    </div>
</body>
</html>
